name: CI / Security / Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  quality:
    name: SAST, SCA, syntax, and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install application and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install bandit pip-audit pre-commit
      - name: Pre-commit checks
        env:
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Python syntax check
        run: python -m compileall -q backend/src backend/scripts
      - name: Bandit SAST gate
        run: bandit -r backend/src/app -ll -x '*/tests/*,*/__pycache__/*'
      - name: Python dependency CVE gate
        run: pip-audit -r backend/requirements.txt --strict
      - name: Static frontend validation
        run: python scripts/validate_frontend.py

  dast:
    name: API smoke test and DAST
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tlf
          POSTGRES_PASSWORD: tlf_ci_password
          POSTGRES_DB: taxlien
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tlf -d taxlien"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.11
        env:
          MEILI_MASTER_KEY: ci_meili_key_not_for_production
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: Initialize CI database
        env:
          PGPASSWORD: tlf_ci_password
        run: psql -h 127.0.0.1 -U tlf -d taxlien -f backend/schema.sql
      - name: Start API and verify health
        env:
          DATABASE_URL: postgresql://tlf:tlf_ci_password@127.0.0.1:5432/taxlien
          JWT_SECRET: ci_only_jwt_secret_00000000000000000000000000000000
          MEILI_URL: http://127.0.0.1:7700
          MEILI_MASTER_KEY: ci_meili_key_not_for_production
          APP_ENV: ci
          PYTHONPATH: backend/src
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/tlf-api.log 2>&1 &
          echo $! > /tmp/tlf-api.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tlf-api.log
          exit 1
      - name: Security header smoke test
        run: ./scripts/security_check.sh http://127.0.0.1:8000
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8000
          fail_action: true
          allow_issue_writing: false
          cmd_options: -a

  deploy:
    name: Production blue-green deploy
    runs-on: ubuntu-latest
    needs: [secrets, quality, dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment: production
    concurrency:
      group: tax-lien-finder-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy verified commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/tax-lien-finder/repo && git fetch --prune origin main && git reset --hard origin/main && TLF_DEPLOY_SHA='$RELEASE_SHA' ./scripts/deploy.sh"
