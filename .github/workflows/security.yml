# SAST + SCA on every PR and push to main
# - Bandit / Semgrep-style checks via Bandit (Python SAST)
# - pip-audit (SCA — vulnerable dependencies)
# - Basic secret hygiene (gitleaks optional if you add the action later)

name: Security (SAST + SCA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write  # needed if you later upload SARIF

jobs:
  sast-sca:
    name: Python SAST + dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install app + security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      # --- SAST: static patterns in YOUR source ---
      - name: Bandit (SAST)
        run: |
          bandit -r src/app \
            -ll \
            -x '*/tests/*,*/__pycache__/*' \
            -f txt

      # --- SCA: known CVEs in dependencies ---
      - name: pip-audit (SCA)
        run: |
          pip-audit -r requirements.txt --strict || pip-audit -r requirements.txt

  # Optional second job: CodeQL (GitHub-native SAST). Enable CodeQL in repo settings
  # or keep this job; first run may need Security → Code scanning enabled.
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
