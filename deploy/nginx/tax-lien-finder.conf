# Nginx reverse proxy for Tax Lien Finder
# - Serves frontend static files
# - Proxies /api and /health to Gunicorn (127.0.0.1:8000)
# - Sets security headers for HTML and API
#
# Install (example):
#   sudo cp deploy/nginx/tax-lien-finder.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/tax-lien-finder.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: use certbot or terminate TLS at your load balancer, then set ENABLE_HSTS=true on the API.

upstream tlf_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect HTTP → HTTPS in production (uncomment after certs exist)
# server {
#     listen 80;
#     server_name liens.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name localhost;   # change to your domain

    # --- Security headers (browser-facing) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS — enable only when serving HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frontend CSP (allows Google Fonts used by the UI)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;

    root /var/www/tax-lien-finder/frontend;
    index index.html;

    # Static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + health → Gunicorn
    location /api/ {
        proxy_pass http://tlf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://tlf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # Optional: expose OpenAPI only on private networks — comment out in public prod
    location /docs {
        proxy_pass http://tlf_api;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://tlf_api;
        proxy_set_header Host $host;
    }

    # Hide nginx version
    server_tokens off;

    # Basic size limits
    client_max_body_size 1m;
}
