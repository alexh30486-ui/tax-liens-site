# Local stack: Postgres + Meilisearch
# Start:  docker compose up -d
# Stop:   docker compose down

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tlf
      POSTGRES_PASSWORD: tlf
      POSTGRES_DB: taxlien
    ports:
      - "5432:5432"
    volumes:
      - tlf_pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tlf -d taxlien"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_meili_master_key_change_me}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - tlf_meili:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tlf_pgdata:
  tlf_meili:
