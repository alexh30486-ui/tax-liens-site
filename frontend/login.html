<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Tax Lien Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-auth-mode="login">
<nav class="nav">
  <a class="nav__mark" href="index.html">Tax Lien Finder</a>
</nav>

<main class="auth-page">
  <a href="index.html" class="auth-back">← Back</a>
  <h1 class="auth-headline">Welcome back</h1>
  <p class="auth-sub">Log in to screen listings by value-to-lien ratio.</p>

  <form id="authForm" novalidate>
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" type="email" id="email" name="email" placeholder="name@company.com" required autocomplete="email">
      <p class="form-error" id="emailError">Enter a valid email address.</p>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" type="password" id="password" name="password" placeholder="Your password" required autocomplete="current-password">
      <p class="form-error" id="passwordError">Enter your password.</p>
    </div>
    <p class="form-error" id="formError"></p>
    <button type="submit" class="btn btn-primary form-submit" id="submitBtn">Log in</button>
  </form>
  <p class="auth-switch">No account yet? <a href="signup.html">Sign up</a></p>
</main>

<script src="js/api.js"></script>
<script src="js/auth-pages.js"></script>
</body>
</html>
