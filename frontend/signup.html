<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Tax Lien Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-auth-mode="signup">
<nav class="nav">
  <a class="nav__mark" href="index.html">Tax Lien Finder</a>
</nav>

<main class="auth-page">
  <a href="index.html" class="auth-back">← Back</a>
  <h1 class="auth-headline">Create your account</h1>
  <p class="auth-sub">Free while in beta. You’ll land on the listings dashboard after signup.</p>

  <form id="authForm" novalidate>
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" type="email" id="email" name="email" placeholder="name@company.com" required autocomplete="email">
      <p class="form-error" id="emailError">Enter a valid email address.</p>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
      <p class="form-hint">At least 8 characters.</p>
      <p class="form-error" id="passwordError">Password needs to be at least 8 characters.</p>
    </div>
    <p class="form-error" id="formError"></p>
    <button type="submit" class="btn btn-primary form-submit" id="submitBtn">Create account</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
</main>

<script src="js/api.js"></script>
<script src="js/auth-pages.js"></script>
</body>
</html>
